<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InveStory переїхав</title>
<meta name="robots" content="noindex">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#0b1220;color:#e8ecf4;font:16px/1.5 system-ui,-apple-system,sans-serif;text-align:center}
  a{color:#f0c14b}
</style>
<script>
  // Здесь раньше жила самая первая версия приложения. Она хранила портфель под
  // тем же ключом localStorage (kapital_v6), что и нынешняя, а домен у них общий:
  // любое действие в старой версии перезаписывало портфель её урезанным форматом.
  // Поэтому старый код больше не запускается — только перенаправление.
  // Данные никто не трогает: хранилище общее, новая версия прочитает их сама.
  (async () => {
    try {
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs
          .filter(r => new URL(r.scope).pathname.startsWith('/InveStory/'))
          .map(r => r.unregister()));
      }
    } catch (e) {}
    location.replace('https://mnacik1988.github.io/kapital01/');
  })();
</script>
<noscript><meta http-equiv="refresh" content="0; url=https://mnacik1988.github.io/kapital01/"></noscript>
</head>
<body>
  <p>InveStory переїхав.<br><a href="https://mnacik1988.github.io/kapital01/">Відкрити нову версію</a></p>
</body>
</html>
